<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Feed Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }

    #phone-frame {
      width: 390px;
      height: 700px;
      background: #000;
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      border: 3px solid #222;
      box-shadow: 0 0 60px #00000088;
    }

    #feed-container {
      height: 100%;
      overflow: hidden;
      padding: 16px 0 80px;
      position: relative;
    }

    .post-card {
      background: #111;
      margin: 0 14px 12px;
      padding: 18px 16px;
      border-radius: 10px;
      animation: slideUp 0.25s ease-out;
      position: relative;
      border: 1px solid #1a1a1a;
    }

    @keyframes slideUp {
      from { transform: translateY(60px); opacity: 0; }
      to   { transform: translateY(0);    opacity: 1; }
    }

    .sentiment-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .outrage     { background: #8b0000; }
    .anger       { background: #7a1a00; }
    .anxiety     { background: #2a2a6a; }
    .sadness     { background: #1a3a5c; }
    .envy        { background: #1a4a1a; }
    .inspiration { background: #7a5a00; }
    .joy         { background: #1a5a3a; }

    .post-title {
      font-size: 15px;
      font-weight: bold;
      color: #fff;
      margin-bottom: 6px;
      margin-right: 90px;
      line-height: 1.3;
    }

    .post-desc {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }

    #stop-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff3333;
      color: #fff;
      border: none;
      padding: 14px 36px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      z-index: 10;
      letter-spacing: 2px;
      box-shadow: 0 0 20px #ff333366;
      transition: background 0.15s;
    }

    #stop-button:hover { background: #ff0000; }

    #session-complete {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff3333;
      font-size: 26px;
      font-weight: bold;
      text-align: center;
      z-index: 20;
      background: rgba(0,0,0,0.92);
      padding: 30px 40px;
      border-radius: 16px;
      border: 2px solid #ff3333;
      letter-spacing: 2px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div id="phone-frame">
    <div id="feed-container"></div>
    <button id="stop-button">STOP</button>
    <div id="session-complete">SESSION<br>COMPLETE</div>
  </div>

  <script>
    const posts = [
      { title: "You won't BELIEVE what happened next",       desc: "The shocking truth they don't want you to know...",      sentiment: "outrage",     emoji: "😡" },
      { title: "This changed my life in 30 seconds",         desc: "Why everyone is obsessed with this simple hack...",      sentiment: "inspiration", emoji: "✨" },
      { title: "They're hiding this from you",               desc: "The mainstream media won't cover this story...",         sentiment: "anger",       emoji: "😡" },
      { title: "Watch before it gets deleted",               desc: "Controversial footage that's going viral right now...",  sentiment: "anxiety",     emoji: "😰" },
      { title: "I tried this trend and instantly regretted it", desc: "Don't make the same mistake I did...",               sentiment: "sadness",     emoji: "😢" },
      { title: "The REAL reason you're unhappy",             desc: "It's not your fault — it's the algorithm.",             sentiment: "outrage",     emoji: "😡" },
      { title: "She got everything I wanted by 22",          desc: "How she built her empire while I was scrolling...",     sentiment: "envy",        emoji: "🟢" },
      { title: "This puppy will make your day",              desc: "You won't stop smiling after seeing this...",           sentiment: "joy",         emoji: "😂" },
      { title: "What they found in the ocean is terrifying", desc: "Scientists are calling it unprecedented...",            sentiment: "anxiety",     emoji: "😰" },
      { title: "Wake up — it's worse than you think",        desc: "The data they don't want you to see...",               sentiment: "anger",       emoji: "😡" },
    ];

    let interval = 1000;
    let postIndex = 0;
    let timerId = null;
    let stopped = false;

    const feedContainer = document.getElementById("feed-container");
    const stopButton    = document.getElementById("stop-button");
    const complete      = document.getElementById("session-complete");

    function showNextPost() {
      if (stopped) return;

      const post = posts[postIndex % posts.length];
      const card = document.createElement("div");
      card.className = "post-card";
      card.innerHTML = `
        <div class="sentiment-badge ${post.sentiment}">${post.emoji} ${post.sentiment.toUpperCase()}</div>
        <div class="post-title">${post.title}</div>
        <div class="post-desc">${post.desc}</div>
      `;

      feedContainer.appendChild(card);
      feedContainer.scrollTop = feedContainer.scrollHeight;

      while (feedContainer.children.length > 6) {
        feedContainer.removeChild(feedContainer.firstChild);
      }

      postIndex++;
      interval = Math.max(interval * 0.75, 80);
      timerId = setTimeout(showNextPost, interval);
    }

    stopButton.addEventListener("click", () => {
      stopped = true;
      clearTimeout(timerId);
      stopButton.style.display = "none";
      complete.style.display = "block";
    });

    setTimeout(() => { if (!stopped) stopButton.click(); }, 20000);

    showNextPost();
  </script>
</body>
</html>
